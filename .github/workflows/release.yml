name: Release

# Builds the SPFx package and attaches it to a GitHub Release whenever a
# version tag (v1.2.3 etc.) is pushed. Nothing else in the release process
# is automated — tagging and pushing the tag is the trigger.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package (ship)
        run: npm run ship

      - name: Extract this version's CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="[$VERSION]" '
              BEGIN { found = 0 }
              /^## \[/ {
                if (found) exit
                if (index($0, ver) > 0) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "See CHANGELOG.md for details." > release_notes.md
          fi

      - name: Prepend installation instructions
        run: |
          {
            echo "## Installation"
            echo ""
            echo "1. Download \`sharepoint-smart-gantt-chart.sppkg\`"
            echo "2. Upload to your SharePoint App Catalog"
            echo "3. Deploy tenant-wide or to specific sites"
            echo ""
          } > full-release-notes.md
          cat release_notes.md >> full-release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: full-release-notes.md
          files: sharepoint/solution/*.sppkg
